name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16.0'
          accept-android-sdk-licenses: 'true'
          packages: 'tools platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install Ninja and CMake
        run: sudo apt-get install -y ninja-build cmake

      - name: Download Android SDK
        run: |
          chmod +x scripts/android/download_android_sdk.sh
          ./scripts/android/download_android_sdk.sh

      - name: Build C++ (CMake)
        run: |
          chmod +x scripts/android/cmake_android.sh
          ./scripts/android/cmake_android.sh

      - name: Copy Android files
        run: |
          cp -r scripts/android/files/* .

      - name: Build APK (Gradle)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ddnet-apk
          path: '**/*.apk'
